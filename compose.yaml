# Odoo 20 Community with the inbound demo data (odoo/INBOUND-SEED.md). The Laravel app runs on the host.
# Use bin/odoo to start, reseed and reset it, because it also copies the seed's API keys to odoo/data.
name: gateway-laravel

x-odoo: &odoo
  image: odoo:20.0-20261112
  volumes:
    - odoo-data:/var/lib/odoo
    - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
    - ./odoo:/seed:ro
    - ./cases:/cases:ro

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - odoo-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Creates the inbound database and loads the base seed on a fresh volume, then exits. A later start finds both
  # done and exits at once.
  odoo-init:
    <<: *odoo
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["bash", "/seed/init.sh"]
    restart: "no"

  odoo:
    <<: *odoo
    depends_on:
      odoo-init:
        condition: service_completed_successfully
    ports:
      - "${ODOO_PORT:-8070}:8069"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8069/web/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 40

volumes:
  odoo-db:
  odoo-data:
