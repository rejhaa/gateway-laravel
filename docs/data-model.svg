<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" role="img" aria-label="The proposals table is the centre. Each audit_log row may point at a proposal, a proposal may replace an earlier one, and a proposal points by id at an Odoo record and a mail message that live outside the database. The oauth tables point at the one user.">
<style>
  svg { --bg: #ffffff; --fg: #1d232b; --muted: #5d6874; --line: #c3cad2; --panel: #f5f7f9; --accent: #0b5cad;
        color: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    svg { --bg: #1c2229; --fg: #e5e9ee; --muted: #9aa5b1; --line: #46515e; --panel: #232a33; --accent: #6aa8ff; }
  }
  .bg { fill: var(--bg); }
  text { fill: currentColor; font-size: 13px; }
  .title { font-weight: 600; }
  .sub { fill: var(--muted); font-size: 11px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .hot { fill: var(--accent); }
  .box { fill: var(--panel); stroke: var(--line); }
  .zone { fill: none; stroke: var(--line); stroke-dasharray: 5 4; }
  .ext { fill: none; stroke: var(--muted); stroke-dasharray: 4 3; }
  .rule { stroke: var(--line); }
  .edge { fill: none; stroke: currentColor; stroke-width: 1.3; }
  .edge.hot { stroke: var(--accent); stroke-width: 1.8; }
  .edge.dash { stroke: var(--muted); stroke-dasharray: 4 3; }
  .head { fill: currentColor; }
  .head.hot { fill: var(--accent); }
  .head.dash { fill: var(--muted); }
</style>
<rect class="bg" width="880" height="430" rx="8"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="head"/></marker>
  <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="head hot"/></marker>
  <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="head dash"/></marker>
</defs>
<rect class="box" x="20" y="40" width="200" height="78" rx="6"/>
<text class="mono title" x="32" y="60">users</text>
<line class="rule" x1="20" y1="70" x2="220" y2="70"/>
<text class="mono" x="32" y="86">id</text>
<text class="sub" x="208" y="86" text-anchor="end">PK</text>
<text class="mono" x="32" y="110">name</text>
<text class="sub" x="208" y="110" text-anchor="end">the one user</text>
<rect class="box" x="20" y="220" width="200" height="78" rx="6"/>
<text class="mono title" x="32" y="240">oauth_*</text>
<line class="rule" x1="20" y1="250" x2="220" y2="250"/>
<text class="mono" x="32" y="266">id</text>
<text class="sub" x="208" y="266" text-anchor="end">PK</text>
<text class="mono" x="32" y="290">user_id</text>
<text class="sub" x="208" y="290" text-anchor="end">FK users</text>
<rect class="box" x="300" y="40" width="260" height="270" rx="6"/>
<text class="mono title" x="312" y="60">proposals</text>
<line class="rule" x1="300" y1="70" x2="560" y2="70"/>
<text class="mono" x="312" y="86">id</text>
<text class="sub" x="548" y="86" text-anchor="end">PK</text>
<text class="mono" x="312" y="110">model, record_id</text>
<text class="sub" x="548" y="110" text-anchor="end">the Odoo record</text>
<text class="mono" x="312" y="134">values</text>
<text class="sub" x="548" y="134" text-anchor="end">proposed fields</text>
<text class="mono" x="312" y="158">before</text>
<text class="sub" x="548" y="158" text-anchor="end">values when proposed</text>
<text class="mono" x="312" y="182">message_id</text>
<text class="sub" x="548" y="182" text-anchor="end">the cited mail</text>
<text class="mono" x="312" y="206">quote</text>
<text class="sub" x="548" y="206" text-anchor="end">the evidence</text>
<text class="mono" x="312" y="230">tier</text>
<text class="sub" x="548" y="230" text-anchor="end">rule, human, policy</text>
<text class="mono" x="312" y="254">status</text>
<text class="sub" x="548" y="254" text-anchor="end">pending to applied</text>
<text class="mono" x="312" y="278">decided_by</text>
<text class="sub" x="548" y="278" text-anchor="end">who decided</text>
<text class="mono" x="312" y="302">replaces</text>
<text class="sub" x="548" y="302" text-anchor="end">FK proposals</text>
<rect class="box" x="640" y="40" width="220" height="246" rx="6"/>
<text class="mono title" x="652" y="60">audit_log</text>
<line class="rule" x1="640" y1="70" x2="860" y2="70"/>
<text class="mono" x="652" y="86">id</text>
<text class="sub" x="848" y="86" text-anchor="end">PK</text>
<text class="mono" x="652" y="110">occurred_at</text>
<text class="mono" x="652" y="134">actor_type</text>
<text class="sub" x="848" y="134" text-anchor="end">agent, user, rule</text>
<text class="mono" x="652" y="158">actor</text>
<text class="mono" x="652" y="182">channel</text>
<text class="sub" x="848" y="182" text-anchor="end">mcp, web, card</text>
<text class="mono" x="652" y="206">event</text>
<text class="mono" x="652" y="230">proposal_id</text>
<text class="sub" x="848" y="230" text-anchor="end">FK proposals</text>
<text class="mono" x="652" y="254">outcome</text>
<text class="sub" x="848" y="254" text-anchor="end">ok, refused, error</text>
<text class="mono" x="652" y="278">detail</text>
<text class="sub" x="848" y="278" text-anchor="end">JSON</text>
<polyline class="edge " points="120,220 120,120" marker-end="url(#a)"/>
<text class="sub" x="128" y="174" text-anchor="start">Claude's tokens</text>
<polyline class="edge " points="640,226 600,226 600,82 562,82" marker-end="url(#a)"/>
<text class="sub" text-anchor="middle" transform="rotate(-90 592 154)" x="592" y="154">many rows per proposal</text>
<polyline class="edge " points="300,298 270,298 270,82 298,82" marker-end="url(#a)"/>
<text class="sub" text-anchor="middle" transform="rotate(-90 262 190)" x="262" y="190">replaces an earlier one</text>
<rect class="ext" x="300" y="370" width="120" height="40" rx="6"/>
<text class="title" x="360.0" y="395.0" text-anchor="middle">Odoo record</text>
<rect class="ext" x="440" y="370" width="120" height="40" rx="6"/>
<text class="title" x="500.0" y="395.0" text-anchor="middle">Mail message</text>
<polyline class="edge dash" points="360,310 360,368" marker-end="url(#ad)"/>
<polyline class="edge dash" points="500,310 500,368" marker-end="url(#ad)"/>
<text class="sub" x="366" y="344" text-anchor="start">record_id</text>
<text class="sub" x="506" y="344" text-anchor="start">message_id</text>
</svg>
