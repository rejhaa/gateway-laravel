[options]
; Odoo 20 Community for the inbound demo, inside the odoo container of compose.yaml. Odoo picks the database from
; db_name and dbfilter, not from the request. The host reaches it on ODOO_PORT (8070 by default).
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
http_interface = 0.0.0.0
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
db_name = inbound
dbfilter = ^inbound$
list_db = False
admin_passwd = inbound-spike
workers = 0
log_level = warn
